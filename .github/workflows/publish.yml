name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check the packed package installs and imports
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/decodo-ai-sdk-*.tgz ai
          node -e "import('@decodo/ai-sdk').then(({ decodoTools }) => decodoTools({ apiKey: 'check' }))"
          node -e "require('@decodo/ai-sdk').decodoTools({ apiKey: 'check' })"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
